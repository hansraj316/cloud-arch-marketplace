[project]
name = "cloud-architecture-diagrams"
version = "0.1.0"
description = "Build editable cloud architecture diagrams (Azure/AWS/GCP) with official vendor icons, emitting both .excalidraw and .drawio."
# PEP 604 unions (e.g. `str | None`) are used throughout, so 3.10+ is required;
# the scripts crash with a TypeError on 3.9.
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "mypy",
    "pytest",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# conftest deliberately guards for Python < 3.10 (the scripts import-crash on
# 3.9), so UP036's "version block is outdated" does not apply here.
"tests/conftest.py" = ["UP036"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
# scripts/ are loaded via sys.path manipulation, not as a package.
explicit_package_bases = true
mypy_path = "scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
addopts = "-v"
