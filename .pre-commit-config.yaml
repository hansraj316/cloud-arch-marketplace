# Pre-commit hooks: run lint + format + type-check at commit stage.
# Install once with:  pre-commit install
# Run on everything:  pre-commit run --all-files
default_language_version:
  python: python3.10

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        name: ruff (lint)
        args: ["--fix"]
        files: ^plugins/cloud-architecture-diagrams/skills/cloud-architecture-diagrams/(scripts|tests)/

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        name: black (format)
        files: ^plugins/cloud-architecture-diagrams/skills/cloud-architecture-diagrams/(scripts|tests)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        name: mypy (type-check)
        files: ^plugins/cloud-architecture-diagrams/skills/cloud-architecture-diagrams/scripts/
        args:
          [
            "--ignore-missing-imports",
            "--explicit-package-bases",
          ]
