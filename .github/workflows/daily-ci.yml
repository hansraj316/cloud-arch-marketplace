name: daily-ci

on:
  push:
  pull_request:
  schedule:
    # Daily at 06:00 UTC.
    - cron: "0 6 * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

defaults:
  run:
    working-directory: plugins/cloud-architecture-diagrams/skills/cloud-architecture-diagrams

jobs:
  quality-and-tests:
    name: lint + types + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10+ is required: the scripts use PEP 604 unions that crash on 3.9.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev tooling
        run: python -m pip install --upgrade pip ruff black mypy pytest

      - name: Lint (ruff)
        run: ruff check scripts tests

      - name: Format check (black)
        run: black --check scripts tests

      - name: Type check (mypy)
        run: mypy scripts

      - name: Tests (pytest)
        run: python -m pytest tests/ -v

      - name: Build smoke test (render example spec)
        run: |
          python scripts/build_diagram.py assets/spec-example.json --out-prefix /tmp/smoke
          test -s /tmp/smoke.excalidraw
          test -s /tmp/smoke.drawio
          python scripts/build_diagram.py assets/spec-example.json --validate
